[package]
name = "discord_bot"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
# 非同期ランタイム
tokio = {version = "1.49.0", features = ["rt-multi-thread", "macros"]}
async-trait = "0.1.89"
governor = "0.10.4"
futures = "0.3.31"

# Discord関連
twilight-gateway = "0.17.1"
twilight-http = "0.17.1"
twilight-mention = "0.17.0"
twilight-model = "0.17.1"
twilight-standby = "0.17.0"
twilight-util = {version = "0.17.0", features = ["snowflake", "permission-calculator"]}
twilight-interactions = "0.17.0"

# シリアライズ/デシリアライズ
serde = {version = "1.0.228", features = ["derive"]}
serde_json = "1.0.149"
toml = "0.9.8"
dotenvy = "0.15.7"

# コマンドライン
clap = {version = "4.5.54", features = ["derive"]}

# ロギング
tracing = "0.1.44"
tracing-subscriber = {version = "0.3.22", features = ["env-filter"]}
tracing-appender = "0.2.4"
sysinfo = {version = "0.37.2", features = ["serde"]}

# 日付と時刻の操作
chrono = {version = "0.4.43", default-features = false, features = ["clock", "serde"]}

# エラー処理
anyhow = "1.0.100"
thiserror = "2.0.17"

# DB関連
sqlx = {version = "0.8.6", features = ["runtime-tokio", "postgres", "chrono", "uuid"]}

# 並行処理
dashmap = "6.1.0"
arc-swap = "1.8.0"

# 安全性
static_assertions = "1.1.0"

# その他
heapless = "0.9.2"
